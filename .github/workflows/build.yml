name: Build Marlin Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build Ender 3 (4.2.2)
        run: |
          platformio run -e STM32F103RE_creality
          mv .pio/build/STM32F103RE_creality/firmware-*.bin .pio/build/STM32F103RE_creality/firmware.bin

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/STM32F103RE_creality/firmware.bin
